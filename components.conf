# components.conf — the pi-setup catalog (single source of truth).
#
# `install.sh` reads this file. To add a new repo, append a [[component]]
# block below — or run:  ./install.sh --add
#
# Grammar — one block per component:
#
#   [[component]]
#   id      = <unique lowercase id>          # required; [a-z0-9-]+
#   type    = extension | skills | step      # required
#   repo    = <github repo name>             # required for extension / skills
#   path    = <install path under $PI_HOME>  # required for extension / skills
#   builtin = <handler name>                 # required for type = step
#   deps    = <space/comma separated ids>    # optional; installed first
#   group   = <menu group label>             # optional; auto-derived from type
#   desc    = <human-readable description>   # recommended
#
# Rules:
#   - Full-line comments start with '#'. No inline comments after values.
#   - Values may be wrapped in double or single quotes (optional).
#   - Unknown keys are reported as warnings (likely a typo).
#   - Validate anytime with: ./install.sh --check

# ── Core ────────────────────────────────────────────────────────────────────
[[component]]
id      = pi-core
type    = step
builtin = install-pi
group   = Core
desc    = Install the pi CLI (@earendil-works/pi-coding-agent) via npm

# ── Skills ──────────────────────────────────────────────────────────────────
[[component]]
id   = skills-library
type = skills
repo = pi-skills-library
path = agent/skills-library
desc = Curated skills library (86 skills across 10 collections)

# ── Extensions ──────────────────────────────────────────────────────────────
[[component]]
id   = list-picker
type = extension
repo = pi-list-picker
path = agent/extensions/list-picker
desc = Reusable TUI list picker component

[[component]]
id   = skill-manager
type = extension
repo = pi-skill-manager
path = agent/extensions/skill-manager
deps = list-picker
desc = Browse, toggle and filter skill libraries

[[component]]
id   = image-workflow
type = extension
repo = pi-image-workflow
path = agent/extensions/image-workflow
desc = Interactive image-collecting workflow

[[component]]
id   = questionnaire
type = extension
repo = pi-questionnaire
path = agent/extensions/questionnaire
desc = Interactive questionnaire component (single/multi/text/confirm/number)

[[component]]
id   = workflow
type = extension
repo = pi-workflow
path = agent/extensions/workflow
desc = /quick, /plan and /ask slash commands

# ── Config ──────────────────────────────────────────────────────────────────
[[component]]
id      = settings
type    = step
builtin = settings
group   = Config
desc    = Subagent model overrides (MiniMax) template -> settings.json
